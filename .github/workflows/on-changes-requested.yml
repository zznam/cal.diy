name: Changes Requested
on:
  pull_request_review:
    types: [submitted]

jobs:
  changes-requested:
    if: github.event.review.state == 'changes_requested'
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LOCAL_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Explanation
        run: echo "This workflow triggers a workflow_run; it's necessary because otherwise the repo secrets aren't available for 'pull_request_review' events from externally forked pull requests"
      - name: Save PR number to context.json
        run: |
            printf '{
              "pr_number": ${{ github.event.pull_request.number }}
            }' >> context.json
      - uses: actions/upload-artifact@v4
        with:
          name: context.json
          path: ./
